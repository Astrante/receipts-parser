apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: receipt-parser
  labels:
    app.kubernetes.io/name: receipt-parser
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: receipt-parser
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receipt-parser
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: receipt-parser-frontend:latest
          imagePullPolicy: IfNotPresent   # образ уже должен быть на ноде (см. README)
          ports:
            - name: http
              containerPort: 80
              hostPort: 11112   # http://<node-ip>:11112 — ниже дефолтного NodePort-диапазона
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: receipt-parser
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: receipt-parser
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
