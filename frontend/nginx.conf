# nginx для фронтенд-образа: раздаёт статику SPA и проксирует /api на backend.
# Всё на одном origin, поэтому браузер не делает cross-origin запросов (CORS не нужен).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Статика фронтенда; SPA-fallback на index.html для клиентского роутинга.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксируем API на backend-сервис.
    # ВАЖНО: без слеша в конце proxy_pass — путь /api/... доходит до бэкенда как есть
    # (бэкенд слушает /api/receipts). Со слешом nginx бы отрезал /api/ и был бы 404.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
